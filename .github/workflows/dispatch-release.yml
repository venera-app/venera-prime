name: Dispatch release as bot
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish on all six platforms'
        required: true
        type: string
      retry_run_id:
        description: 'Optional completed bot Build ALL run to retry failed jobs for the same tag'
        required: false
        type: string
      publish_build_run_id:
        description: 'Optional bot run with six successful builds; recover publishing from the default branch'
        required: false
        type: string
permissions:
  actions: write
  # A bot rerun must retain the release publisher's contents permission.
  contents: write
jobs:
  Dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Validate tag and dispatch Build ALL with the GitHub Actions token
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          PUBLISH_BUILD_RUN_ID: ${{ inputs.publish_build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent
          if [[ -n "$PUBLISH_BUILD_RUN_ID" ]]; then
            [[ -z "$RETRY_RUN_ID" && "$PUBLISH_BUILD_RUN_ID" =~ ^[0-9]+$ ]]
            branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
            jq -n --arg ref "$branch" --arg tag "$RELEASE_TAG" --arg run "$PUBLISH_BUILD_RUN_ID" '{
              ref: $ref,
              inputs: {
                release_tag: $tag, publish_build_run_id: $run,
                publish_release: "true", allow_personal_trigger: "false",
                build_macos: "false", build_ios: "false", build_android: "false",
                build_windows: "false", build_linux: "false", build_linux_arm64: "false"
              }
            }' | gh api --method POST "repos/$GH_REPO/actions/workflows/main.yml/dispatches" --input -
            exit 0
          fi
          if [[ -n "$RETRY_RUN_ID" ]]; then
            [[ "$RETRY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected numeric run ID'; exit 1; }
            tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            gh api "repos/$GH_REPO/actions/runs/$RETRY_RUN_ID" > "$RUNNER_TEMP/retry-run.json"
            jq -e --arg sha "$tag_sha" --arg tag "$RELEASE_TAG" '
              .path == ".github/workflows/main.yml" and
              .event == "workflow_dispatch" and .head_branch == $tag and
              .head_sha == $sha and .status == "completed" and
              (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") and
              .actor.login == "github-actions[bot]" and
              .triggering_actor.login == "github-actions[bot]"
            ' "$RUNNER_TEMP/retry-run.json" > /dev/null
            gh api --method POST "repos/$GH_REPO/actions/runs/$RETRY_RUN_ID/rerun-failed-jobs"
            exit 0
          fi
          jq -n --arg tag "$RELEASE_TAG" '{
            ref: $tag,
            inputs: {
              release_tag: $tag,
              publish_release: "true",
              allow_personal_trigger: "false",
              build_macos: "true", build_ios: "true", build_android: "true",
              build_windows: "true", build_linux: "true", build_linux_arm64: "true"
            }
          }' | gh api --method POST "repos/$GH_REPO/actions/workflows/main.yml/dispatches" --input -
